name: Release installers (Electron)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nome da release (ex: v1.1.0)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os: 'ubuntu-22.04'
            args: '--linux AppImage deb'
          - platform: 'windows-latest'
            os: 'windows-latest'
            args: '--win nsis'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2

      - name: Install npm deps
        run: npm ci

      # os testes rodam no Linux (são de lógica, iguais em qualquer sistema); na máquina Windows do GitHub
      # o teste dos níveis do bot estoura o tempo
      - name: Tests
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Build Electron App
        run: npx electron-builder ${{ matrix.args }} --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-sun-${{ matrix.platform }}
          path: release/*.AppImage
          if-no-files-found: ignore

      - name: Upload .exe
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: void-sun-windows
          path: release/*.exe
          if-no-files-found: ignore

      - name: Upload .deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: void-sun-linux-deb
          path: release/*.deb
          if-no-files-found: ignore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Void Sun ${{ github.ref_name }}"
          body: |
            ## Void Sun — instaladores

            **Windows:** baixe o `.exe` e dê dois cliques para instalar.
            **Linux:** baixe o `.AppImage` (marque como executável) ou o pacote `.deb`.

            O jogo já vem com os 7 heróis prontos, os decks de classe, os itens, as artes das cartas e o modo Jornada.
            O que você criar (heróis, decks, cartas) fica salvo no seu computador.
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          draft: false
          prerelease: false
